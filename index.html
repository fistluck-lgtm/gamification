<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3e7">
<title>교과 학습 게임</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  :root {
    --bg: #fbf3e7;
    --bg-2: #f3e6d3;
    --ink: #3a2c25;
    --ink-soft: #7d6a5d;
    --card: #ffffff;
    --line: rgba(58,44,37,.12);
    --focus: #e0663e;
    --shadow: 0 10px 28px rgba(110,78,52,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(900px 420px at 50% -120px, #fff8ee 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: 'Gowun Dodum', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px 36px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- 상단 ---------- */
  header { text-align: center; margin: 0 0 30px; }
  .hero {
    display: none;
    margin: 0 auto;
    max-width: 100%;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 4px solid #fff;
    background: var(--bg-2);
  }
  /* 이미지 비율을 그대로 쓰되, 화면 높이가 낮으면 위아래를 조금 잘라 게임 카드가 빨리 보이게 */
  .hero img { width: 100%; height: auto; max-height: 58vh; object-fit: cover; object-position: center 40%; display: block; }
  .has-hero .hero { display: block; position: relative; }
  /* 대표 이미지가 있으면 학교 마크·이름을 이미지 안쪽 아래 가운데에 */
  .hero .school {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    margin: 0; white-space: nowrap;
    background: rgba(255,255,255,.9);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-color: rgba(255,255,255,.7);
    box-shadow: 0 6px 20px rgba(60,40,25,.22);
  }
  /* 학교 마크 + 학교 이름 (대표 이미지 위) */
  .school {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Jua', sans-serif; font-size: 19px; font-weight: 400;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    padding: 6px 18px 6px 8px; border-radius: 999px;
    margin: 0 0 16px;
    box-shadow: 0 4px 14px rgba(110,78,52,.10);
  }
  .school img { height: 40px; width: auto; max-width: 120px; object-fit: contain; display: block; }
  .school.text-only { padding: 7px 18px; }
  .school.logo-only { padding: 6px 10px; }
  .school:empty, .greeting:empty { display: none; }
  @media (max-width: 480px) {
    .school { font-size: 17px; gap: 8px; margin-bottom: 12px; }
    .school img { height: 34px; }
    .hero .school { bottom: 8px; font-size: 14px; gap: 6px; padding: 4px 12px 4px 5px; }
    .hero .school.text-only { padding: 4px 12px; }
    .hero .school.logo-only { padding: 4px 6px; }
    .hero .school img { height: 26px; }
  }
  h1 {
    font-family: 'Jua', 'Gowun Dodum', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 6vw, 56px);
    margin: 0; line-height: 1.1;
  }
  .greeting { color: var(--ink-soft); margin: 14px 0 0; font-size: clamp(16px, 2.2vw, 19px); }

  /* ---------- 게임 카드 ---------- */
  .games {
    display: grid;
    gap: 22px;
    grid-template-columns: 1fr;
    max-width: 760px;
    margin: 0 auto;
  }
  @media (min-width: 1000px) {
    .games { grid-template-columns: repeat(3, 1fr); max-width: none; }
  }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .game {
    flex: 1;
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    color: inherit; text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow: var(--shadow);
  }
  a.game:hover { transform: translateY(-4px); box-shadow: 0 18px 38px rgba(110,78,52,.22); border-color: var(--accent); }
  a.game:hover .banner img { transform: scale(1.03); }
  a.game:active { transform: translateY(-1px) scale(.99); }
  a.game:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .banner {
    aspect-ratio: 2912 / 1440;
    position: relative;
    overflow: hidden;
    background: var(--accent);
  }
  .banner img, .banner svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .35s ease;
  }
  .body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title {
    font-family: 'Jua', 'Gowun Dodum', sans-serif;
    font-weight: 400;
    font-size: 28px; line-height: 1.15; margin: 0;
    color: var(--accent);
  }
  .tagline { margin: 0; color: var(--ink-soft); font-size: 16px; line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span {
    font-family: 'Jua', sans-serif; font-weight: 400;
    font-size: 13px; letter-spacing: .02em;
    padding: 4px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, white);
    color: color-mix(in srgb, var(--accent) 85%, black);
  }
  .enter {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-family: 'Jua', sans-serif; font-weight: 400; font-size: 19px;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 70%, black);
  }
  a.game:active .enter { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, black); }
  .enter svg { width: 20px; height: 20px; }

  /* 준비 중 */
  .game.soon { cursor: default; }
  .game.soon .banner > :not(.badge) { filter: grayscale(.8) brightness(.85); }
  .game.soon .enter { background: var(--bg-2); color: var(--ink-soft); box-shadow: none; }
  .badge {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(40,28,22,.7); color: #fff;
    font-family: 'Jua', sans-serif; font-size: 14px; font-weight: 400;
    padding: 5px 12px; border-radius: 999px;
  }

  /* ---------- 하단 ---------- */
  footer {
    margin-top: 34px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    color: var(--ink-soft); font-size: 14px; text-align: center;
  }
  .teacher-toggle {
    font: inherit; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 9px 18px; border-radius: 999px; cursor: pointer;
  }
  .teacher-toggle:hover { color: var(--ink); border-color: rgba(58,44,37,.3); }
  .teacher-toggle[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 선생님 관리 버튼 — 각 게임 카드 바로 아래, 학생 입장 버튼과 같은 색 */
  .teach {
    display: none;
    align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 16px;
    border-radius: 14px;
    background: var(--accent); color: #fff;
    font-family: 'Jua', sans-serif; font-size: 17px;
    text-decoration: none;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 70%, black);
    transition: transform .12s ease, filter .12s ease;
  }
  .teach svg { width: 18px; height: 18px; flex-shrink: 0; }
  a.teach:hover { filter: brightness(1.08); }
  a.teach:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, black); }
  a.teach:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .teach.none { background: var(--bg-2); color: var(--ink-soft); box-shadow: none; font-size: 15px; }
  .teacher-on .teach { display: flex; }

  @media (max-width: 480px) {
    .hero { border-radius: 18px; border-width: 3px; }
    .title { font-size: 24px; }
    .body { padding: 14px 16px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .game, .banner img { transition: none; }
    a.game:hover, a.game:hover .banner img { transform: none; }
    .teach { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="hero" id="hero"><img id="heroImg" alt=""></div>
    <div class="school" id="school"></div>
    <h1 id="siteTitle">교과 학습 게임</h1>
    <p class="greeting" id="greeting"></p>
  </header>

  <main class="games" id="games" aria-label="게임 목록"></main>

  <footer>
    <div id="footerNote"></div>
    <button class="teacher-toggle" id="teacherToggle" aria-expanded="false">선생님 메뉴</button>
  </footer>
</div>

<script src="./config.js"></script>
<script>
(function () {
  var cfg = window.PORTAL_CONFIG || {};
  var ACCENTS = { olympos: '#4a3d8f', baeum: '#3f8a3a', braincube: '#1f74c9' };
  var FALLBACK = ['#e0663e', '#4f7be0', '#c9a12a', '#d14f8a'];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function isExternal(url) { return /^https?:\/\//i.test(url); }

  // 상단
  var title = cfg.siteTitle || '교과 학습 게임';
  document.title = cfg.schoolName ? title + ' | ' + cfg.schoolName : title;
  document.getElementById('siteTitle').textContent = title;
  // 학교 마크와 학교 이름
  var school = document.getElementById('school');
  var logo = cfg.schoolLogo && String(cfg.schoolLogo).trim();
  if (logo) {
    var li = el('img');
    li.src = logo;
    li.alt = cfg.schoolName ? cfg.schoolName + ' 학교 마크' : '학교 마크';
    li.onerror = function () { li.remove(); school.className = 'school text-only'; };
    school.appendChild(li);
    // 브라우저 탭 아이콘도 학교 마크로
    var fav = document.querySelector('link[rel="icon"]');
    if (fav) fav.href = logo;
  }
  if (cfg.schoolName) school.appendChild(el('span', null, cfg.schoolName));
  school.className = 'school' + (logo && !cfg.schoolName ? ' logo-only' : (!logo && cfg.schoolName ? ' text-only' : ''));
  document.getElementById('greeting').textContent = cfg.greeting || '';
  document.getElementById('footerNote').textContent = cfg.footerNote || '';

  // 대표 이미지: 지정하면 큰 제목 대신 이미지를 보여 줍니다
  if (cfg.heroImage) {
    var heroImg = document.getElementById('heroImg');
    heroImg.alt = title;
    heroImg.onerror = function () {
      document.getElementById('top').classList.remove('has-hero');
      document.getElementById('top').insertBefore(school, document.getElementById('siteTitle'));
      document.getElementById('siteTitle').classList.remove('sr-only');
    };
    heroImg.src = cfg.heroImage;
    document.getElementById('hero').appendChild(school);
    document.getElementById('top').classList.add('has-hero');
    document.getElementById('siteTitle').classList.add('sr-only');
  }

  // 게임 카드
  var list = document.getElementById('games');
  var games = (cfg.games || []).filter(function (g) { return g && g.visible !== false; });

  games.forEach(function (g, i) {
    var ready = !!(g.url && String(g.url).trim());
    var card = el(ready ? 'a' : 'div', 'game' + (ready ? '' : ' soon'));
    card.style.setProperty('--accent', g.accent || ACCENTS[g.id] || FALLBACK[i % FALLBACK.length]);

    if (ready) {
      card.href = g.url;
      if (g.newTab) { card.target = '_blank'; card.rel = 'noopener'; }
      card.setAttribute('aria-label', g.title + ' 입장하기');
    } else {
      card.setAttribute('aria-disabled', 'true');
    }

    var banner = el('div', 'banner');
    if (g.image) {
      var img = el('img');
      img.src = g.image; img.alt = g.title + ' 대표 이미지';
      img.onerror = function () { img.remove(); addArt(banner, g.id); };
      banner.appendChild(img);
    } else {
      addArt(banner, g.id);
    }
    if (!ready) banner.appendChild(el('span', 'badge', '준비 중'));
    card.appendChild(banner);

    var body = el('div', 'body');
    body.appendChild(el('h2', 'title', g.title || '이름 없는 게임'));
    if (g.tagline) body.appendChild(el('p', 'tagline', g.tagline));
    if (g.tags && g.tags.length) {
      var tags = el('div', 'tags');
      g.tags.forEach(function (t) { tags.appendChild(el('span', null, t)); });
      body.appendChild(tags);
    }
    var enter = el('div', 'enter');
    if (ready) {
      enter.appendChild(document.createTextNode('입장하기'));
      enter.insertAdjacentHTML('beforeend',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
    } else {
      enter.textContent = '곧 열려요';
    }
    body.appendChild(enter);
    card.appendChild(body);

    var col = el('div', 'col');
    col.style.setProperty('--accent', card.style.getPropertyValue('--accent'));
    col.appendChild(card);
    col.appendChild(teacherButton(g));
    list.appendChild(col);
  });

  function addArt(banner, id) {
    var tpl = document.getElementById('art-' + id);
    if (tpl) banner.insertBefore(tpl.content.cloneNode(true), banner.firstChild);
  }

  // 선생님 관리 버튼 (각 게임 카드 아래)
  function teacherButton(g) {
    var url = g.teacherUrl && String(g.teacherUrl).trim();
    if (!url) return el('div', 'teach none', '관리 주소 미등록');
    var a = el('a', 'teach');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', g.title + ' 교사용 관리 페이지 (새 탭)');
    a.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>');
    a.appendChild(document.createTextNode('선생님 관리 페이지'));
    return a;
  }

  // 선생님 메뉴: 누르면 각 게임 아래에 관리 버튼이 나타납니다
  var toggle = document.getElementById('teacherToggle');
  toggle.addEventListener('click', function () {
    var on = document.body.classList.toggle('teacher-on');
    toggle.setAttribute('aria-expanded', on ? 'true' : 'false');
    toggle.textContent = on ? '선생님 메뉴 닫기' : '선생님 메뉴';
    if (on) {
      var first = document.querySelector('.teach');
      if (first) {
        var r = first.getBoundingClientRect();
        if (r.top < 0 || r.bottom > window.innerHeight) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  });
})();
</script>
</body>
</html>
